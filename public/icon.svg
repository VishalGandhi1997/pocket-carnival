<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2ff0"/>
      <stop offset="0.5" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#341073"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- ground -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- confetti dots -->
  <circle cx="96" cy="120" r="10" fill="#ffffff" opacity="0.18"/>
  <circle cx="430" cy="150" r="8" fill="#ffffff" opacity="0.16"/>
  <circle cx="410" cy="380" r="12" fill="#ffffff" opacity="0.14"/>
  <circle cx="110" cy="400" r="8" fill="#ffffff" opacity="0.16"/>
  <!-- three game tiles = "many mini-games", the BlockBazi motif -->
  <g>
    <rect x="150" y="150" width="118" height="118" rx="26" fill="#2ee6a8"/>
    <rect x="150" y="150" width="118" height="60" rx="26" fill="#ffffff" opacity="0.22"/>
    <rect x="278" y="150" width="118" height="118" rx="26" fill="#ff5c8a"/>
    <rect x="278" y="150" width="118" height="60" rx="26" fill="#ffffff" opacity="0.22"/>
    <rect x="150" y="278" width="118" height="118" rx="26" fill="url(#gold)"/>
    <rect x="150" y="278" width="118" height="60" rx="26" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- coin accent bottom-right -->
  <circle cx="337" cy="337" r="59" fill="url(#gold)" stroke="#c87f0a" stroke-width="6"/>
  <circle cx="337" cy="337" r="40" fill="none" stroke="#c87f0a" stroke-width="5" opacity="0.55"/>
</svg>
