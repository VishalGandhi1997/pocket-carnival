<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Khel Mela — Feature Graphic 1024×500</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@800&display=swap");
      * { margin: 0; box-sizing: border-box; }
      body { background: #222; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      /* EXACT Play Store feature-graphic size. Screenshot this element at 1×. */
      .fg {
        width: 1024px; height: 500px; position: relative; overflow: hidden;
        background: linear-gradient(135deg, #7b2ff0 0%, #5b21b6 45%, #341073 100%);
        font-family: "Nunito Sans", sans-serif; color: #fff;
      }
      .fg::before {
        content: ""; position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255,255,255,0.08) 2px, transparent 2px);
        background-size: 34px 34px;
      }
      .glow1 { position: absolute; width: 460px; height: 460px; border-radius: 50%; top: -180px; left: -120px; background: radial-gradient(circle, rgba(255,159,28,0.5), transparent 65%); }
      .glow2 { position: absolute; width: 520px; height: 520px; border-radius: 50%; bottom: -220px; right: -120px; background: radial-gradient(circle, rgba(255,92,138,0.4), transparent 65%); }
      .content { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 66px; }
      .left { flex: 1; }
      .logo { font-family: "Baloo 2"; font-weight: 800; font-size: 82px; line-height: 1; transform: rotate(-2deg); text-shadow: 0 5px 0 rgba(0,0,0,0.3); }
      .logo em { font-style: normal; background: linear-gradient(180deg, #ffe9a8, #f5a623); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .tag { font-weight: 800; font-size: 30px; margin-top: 14px; opacity: 0.95; }
      .pills { display: flex; gap: 12px; margin-top: 26px; }
      .pill { font-family: "Baloo 2"; font-weight: 700; font-size: 20px; padding: 9px 20px; border-radius: 999px; background: rgba(255,255,255,0.16); }
      .pill.gold { background: linear-gradient(180deg, #ffe9a8, #f5a623); color: #5c3a00; }
      /* tile cluster on the right */
      .tiles { position: relative; width: 340px; height: 340px; margin-left: 20px; }
      .t { position: absolute; width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 10px 0 rgba(0,0,0,0.25); }
      .t::after { content: ""; position: absolute; inset: 0 0 55% 0; background: linear-gradient(180deg, rgba(255,255,255,0.32), transparent); border-radius: 28px 28px 40% 40%; }
      .t1 { background: #2ee6a8; top: 20px; left: 40px; transform: rotate(-8deg); }
      .t2 { background: #ff5c8a; top: 0; left: 176px; transform: rotate(7deg); }
      .t3 { background: linear-gradient(180deg,#ffd75e,#f5a623); top: 150px; left: 20px; transform: rotate(6deg); }
      .t4 { background: #4cc9f0; top: 168px; left: 168px; transform: rotate(-6deg); display: flex; align-items: center; justify-content: center; font-size: 62px; }
      .coin { position: absolute; width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(180deg,#ffe9a8,#f5a623); border: 6px solid #c87f0a; bottom: 24px; right: 30px; }
    </style>
  </head>
  <body>
    <div class="fg">
      <div class="glow1"></div>
      <div class="glow2"></div>
      <div class="content">
        <div class="left">
          <div class="logo">Khel<em>Mela</em></div>
          <div class="tag">40 games. One app.</div>
          <div class="pills">
            <span class="pill gold">Puzzle</span>
            <span class="pill">Board</span>
            <span class="pill">Arcade</span>
            <span class="pill">2-Player</span>
          </div>
        </div>
        <div class="tiles">
          <div class="t t1"></div>
          <div class="t t2"></div>
          <div class="t t3"></div>
          <div class="t t4">🎲</div>
          <div class="coin"></div>
        </div>
      </div>
    </div>
  </body>
</html>
